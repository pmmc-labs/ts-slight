<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slight</title>
<style>
    body     { font-family: monospace; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; height: 16rem; font-family: monospace; font-size: 0.9rem; }
    pre      { background: #111; color: #ddd; padding: 1rem; min-height: 8rem; white-space: pre-wrap; }
    button   { font-family: monospace; font-size: 1rem; padding: 0.25rem 1.5rem; }
</style>
</head>
<body>
<h1>slight</h1>
<textarea id="source" spellcheck="false">
(defun fib (n)
    (if (&lt; n 2) n
        (+ (fib (- n 1)) (fib (- n 2)))))

(sys/io/print-ln "fib(20) = " (fib 20))
</textarea>
<p><button id="run">run</button></p>
<pre id="output"></pre>
<script type="module">
    import { run } from './js/src/browser.js';

    const output  = document.getElementById('output');
    const source  = document.getElementById('source');
    const button  = document.getElementById('run');
    const prelude = await (await fetch('./lib/Prelude.slight')).text();

    const log = console.log.bind(console);
    console.log = (...args) => {
        log(...args);
        output.textContent += args.join(' ') + "\n";
    };

    button.addEventListener('click', async () => {
        output.textContent = '';
        button.disabled = true;
        try {
            await run(source.value, prelude);
        } catch (e) {
            output.textContent += `ERROR: ${e}\n`;
        } finally {
            button.disabled = false;
        }
    });
</script>
</body>
</html>
