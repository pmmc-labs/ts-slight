<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slight</title>
<style>
    .input  { font-family: monospace; }
    .output { font-family: monospace; background: #369; color: #fff; }
    .error  { font-family: monospace; background: #963; color: #fff; }
</style>
</head>
<body>
<table cellpadding="5" cellspacing="5" border="5">
    <tr>
        <td>
            <textarea id="source" class="input" rows="40" cols="80">

(defun fact (n)
    (if (== n 0) 1
        (* n (fact (- n 1)))))

(defun fib (n)
    (if (< n 2) n
        (+ (fib (- n 1)) (fib (- n 2)))))

(pprint (fact (fib 6)))

            </textarea>
        </td>
        <td width="40%" valign="top">
            <div id="stdout"></div>
        </td>
    </tr>
    <tr>
        <td>
            <button id="run">run</button>
        </td>
        <td>
            <span><input type="checkbox" /> debug</span>
        </td>
    </tr>
</table>
<script type="module">
    import { run } from './js/src/browser.js';

    const output  = document.getElementById('stdout');
    const source  = document.getElementById('source');
    const button  = document.getElementById('run');
    const prelude = await (await fetch('./lib/Prelude.slight')).text();

    const log = console.log.bind(console);
    console.log = (...args) => {
        log(...args);
        output.innerHTML = output.innerHTML + '<div class="output">' + args.join(' ') + '</div>';
    };

    button.addEventListener('click', async () => {
        output.textContent = '';
        button.disabled = true;
        try {
            await run(source.value, prelude);
        } catch (e) {
            output.innerHTML += '<div class="error">' + `ERROR: ${e}` + '</div>';
        } finally {
            button.disabled = false;
        }
    });
</script>
</body>
</html>
